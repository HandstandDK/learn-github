<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📰 News Word Quiz</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
    }

    .container { width: 100%; max-width: 660px; }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    h1 { font-size: 1.55rem; font-weight: 800; color: #f8fafc; letter-spacing: -0.03em; }
    .score { font-size: 0.82rem; color: #64748b; margin-top: 0.2rem; }
    .score strong { color: #a78bfa; }
    .version {
      font-size: 0.62rem; font-weight: 700; font-family: monospace;
      color: #475569; background: #1e293b; border: 1px solid #334155;
      padding: 0.2rem 0.55rem; border-radius: 999px; letter-spacing: 0.06em;
      margin-top: 0.25rem; white-space: nowrap;
    }

    /* ── CATEGORIES ── */
    .categories {
      display: flex; gap: 0.45rem; flex-wrap: wrap; margin-bottom: 0.75rem;
    }
    .cat {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.4rem 0.85rem; border-radius: 999px;
      border: 1.5px solid #334155; background: transparent;
      color: #94a3b8; font-size: 0.8rem; font-weight: 500;
      cursor: pointer; transition: all 0.13s; white-space: nowrap;
    }
    .cat:hover  { border-color: #6366f1; color: #c7d2fe; }
    .cat.active { border-color: #6366f1; background: #1e1b4b; color: #e0e7ff; }

    /* ── CONTROLS ── */
    .controls {
      display: flex; justify-content: flex-end;
      min-height: 2rem; margin-bottom: 0.75rem;
    }
    .refresh {
      display: none; align-items: center; gap: 0.4rem;
      padding: 0.38rem 0.85rem; background: transparent;
      border: 1.5px solid #334155; border-radius: 0.5rem;
      color: #64748b; font-size: 0.78rem; cursor: pointer; transition: all 0.13s;
    }
    .refresh:hover { border-color: #6366f1; color: #a78bfa; }
    .refresh.visible { display: inline-flex; }
    .refresh .icon { display: inline-block; transition: transform 0.1s; }
    .refresh.spinning .icon { animation: spin 0.55s linear infinite; }

    /* ── CARD ── */
    .card {
      background: #1e293b; border-radius: 1.25rem; padding: 1.75rem;
      border: 1px solid #334155; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    /* ── EMPTY / LOADING STATES ── */
    .state { text-align: center; padding: 2.75rem 1rem; color: #475569; }
    .state h2 { font-size: 1rem; font-weight: 600; color: #64748b; margin-bottom: 0.4rem; }
    .state p  { font-size: 0.85rem; }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid #1e3a5f; border-top-color: #6366f1;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── GAME ── */
    .card-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1rem;
    }
    .tag {
      font-size: 0.67rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.12em; color: #475569;
    }
    .timer {
      font-size: 0.75rem; font-weight: 600; font-variant-numeric: tabular-nums;
      color: #475569; min-width: 3.5rem; text-align: right;
      transition: color 0.2s;
    }
    .timer.running { color: #f59e0b; }
    .timer.done    { color: #4ade80; }

    /* progress dots */
    .progress { display: flex; align-items: center; gap: 6px; margin-bottom: 1.2rem; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #334155; transition: background 0.2s;
    }
    .dot.done    { background: #22c55e; }
    .dot.current { background: #6366f1; }

    .headline {
      font-size: 1.13rem; line-height: 1.72; color: #f1f5f9;
      font-weight: 500; margin-bottom: 1.6rem;
    }
    .blank {
      display: inline-block; background: #1e3a5f; border-radius: 0.35rem;
      border-bottom: 2px solid #6366f1; min-width: 5rem; height: 1.5rem;
      vertical-align: middle; position: relative; top: -2px;
    }

    .options { display: flex; flex-direction: column; gap: 0.55rem; margin-bottom: 1.1rem; }
    .opt {
      width: 100%; padding: 0.72rem 1.2rem;
      background: #0f172a; border: 2px solid #334155; border-radius: 0.7rem;
      color: #cbd5e1; font-size: 0.94rem; font-weight: 500;
      cursor: pointer; text-align: left;
      transition: border-color 0.12s, background 0.12s, color 0.12s;
    }
    .opt:hover:not(:disabled) { border-color: #818cf8; background: #1e1b4b; color: #e0e7ff; }
    .opt.correct { border-color: #22c55e; background: #052e16; color: #86efac; }
    .opt.wrong   { border-color: #ef4444; background: #450a0a; color: #fca5a5; }
    .opt:disabled { cursor: default; }

    .feedback {
      border-radius: 0.6rem; padding: 0.85rem 1rem;
      font-size: 0.87rem; font-weight: 500; line-height: 1.55;
      margin-bottom: 1rem; display: none;
    }
    .feedback.show { display: block; }
    .feedback.ok  { background: #052e16; border: 1px solid #166534; color: #86efac; }
    .feedback.bad { background: #3b0b0b; border: 1px solid #991b1b; color: #fca5a5; }
    .feedback.ok a {
      color: #4ade80; font-weight: 600;
      text-decoration: underline; text-underline-offset: 2px;
    }
    .feedback.ok a:hover { color: #86efac; }

    .next-btn {
      width: 100%; padding: 0.78rem;
      background: #4f46e5; border: none; border-radius: 0.7rem;
      color: #fff; font-size: 0.94rem; font-weight: 700;
      cursor: pointer; transition: background 0.12s; display: none;
    }
    .next-btn:hover { background: #4338ca; }
    .next-btn.show  { display: block; }

    /* ── TOOLTIP ── */
    #tooltip {
      position: fixed; z-index: 9999; max-width: 290px; min-width: 200px;
      background: #0f172a; border: 1px solid #334155;
      border-radius: 0.8rem; padding: 0.9rem 1rem;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      pointer-events: none; display: none; font-size: 0.8rem;
    }
    #tooltip.show { display: block; }

    .tip-loading { display: flex; flex-direction: column; gap: 0.55rem; }
    .tip-label   { display: flex; align-items: center; gap: 0.5rem; color: #64748b; font-size: 0.77rem; }

    /* Bounce dots */
    .dots { display: inline-flex; gap: 3px; }
    .dots span {
      display: inline-block; width: 5px; height: 5px;
      background: #6366f1; border-radius: 50%; animation: bounce 0.75s infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%,100% { transform: translateY(0); opacity: 1; }
      50%      { transform: translateY(-5px); opacity: 0.5; }
    }

    /* Shimmer bars */
    .shimmer-wrap { display: flex; flex-direction: column; gap: 4px; }
    .shimmer {
      height: 8px; border-radius: 4px;
      background: linear-gradient(90deg, #1e293b 0%, #334155 50%, #1e293b 100%);
      background-size: 200% 100%;
      animation: shimmer 1.1s infinite;
    }
    .shimmer.s { width: 55%; }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .tip-pub  { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; margin-bottom: 0.3rem; }
    .tip-desc { color: #cbd5e1; line-height: 1.5; }
  </style>
</head>
<body>
<div class="container">

  <header>
    <div>
      <h1>📰 News Word Quiz</h1>
      <p class="score">Score: <strong id="scoreEl">0 / 0</strong></p>
    </div>
    <span class="version">v0.2</span>
  </header>

  <div class="categories">
    <button class="cat" data-cat="sport">⚽ Sport</button>
    <button class="cat" data-cat="science">🔬 Science</button>
    <button class="cat" data-cat="ai">🤖 AI</button>
    <button class="cat" data-cat="danish">🇩🇰 Danish</button>
    <button class="cat" data-cat="european">🇪🇺 European</button>
    <button class="cat" data-cat="american">🇺🇸 American</button>
  </div>

  <div class="controls">
    <button class="refresh" id="refreshBtn" onclick="doRefresh()">
      <span class="icon">↻</span> New headlines
    </button>
  </div>

  <div class="card">
    <div class="state" id="pickState">
      <h2>Pick a category above</h2>
      <p>Choose a topic to load 5 fresh headlines</p>
    </div>

    <div class="state" id="loadState" style="display:none">
      <div class="spinner"></div>
      <p id="loadMsg">Fetching headlines…</p>
    </div>

    <div id="gameEl" style="display:none">
      <div class="card-top">
        <span class="tag">Guess the missing word</span>
        <span class="timer" id="timerEl">0.0s</span>
      </div>
      <div class="progress" id="progressEl"></div>
      <p class="headline" id="headlineEl"></p>
      <div class="options" id="optionsEl"></div>
      <div class="feedback" id="feedbackEl"></div>
      <button class="next-btn" id="nextBtn" onclick="doNext()">Next headline →</button>
    </div>
  </div>

</div>

<div id="tooltip"></div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────

const BATCH = 5;

const CATS = {
  sport:    { label:'Sport',         type:'hn',  lang:'en', q:'football' },
  science:  { label:'Science',       type:'hn',  lang:'en', q:'research' },
  ai:       { label:'AI',            type:'hn',  lang:'en', q:'LLM' },
  danish:   { label:'Danish News',   type:'da',  lang:'da' },
  european: { label:'European News', type:'hn',  lang:'en', q:'European' },
  american: { label:'American News', type:'hn',  lang:'en', q:'Congress' },
};

const STOP_EN = new Set([
  'the','a','an','is','are','was','were','be','been','being','have','has','had',
  'do','does','did','will','would','could','should','may','might','shall','can',
  'to','in','on','at','by','for','with','about','against','between','into',
  'through','during','before','after','above','below','from','up','down','out',
  'off','over','under','again','then','once','here','there','when','where','why',
  'how','all','both','each','few','more','most','other','some','such','no','nor',
  'not','only','own','same','so','than','too','very','just','but','if','or','as',
  'and','of','it','its','this','that','these','those','he','she','they','we',
  'you','his','her','their','our','your','my','me','him','us','them','who',
  'which','what','new','says','say','said','also','now','get','make','take',
  'come','per','via','non','anti','pro','co','ex','re','un','one','two','three',
  'year','years','time','day','days','week','weeks','month','months','back',
]);

const STOP_DA = new Set([
  'og','i','er','at','en','det','den','til','af','på','som','med','han','hun',
  'de','vi','du','jeg','ikke','der','fra','har','var','sig','om','men','for',
  'man','kan','når','vil','ind','dem','sin','ser','nu','et','ud','så','hvad',
  'hvis','over','under','efter','også','kun','selv','alle','meget','eller','hans',
  'uden','denne','disse','dette','da','her','fik','to','tre','fire','fem','sit',
  'sine','dens','dets','ingen','noget','nogen','mange','skal','have','blive',
  'være','gøre','tage','sige','komme','gå','se','ved','mod','hos','end','bare',
  'inden','siden','dog','ellers','altså','samt','af','pr','via',
]);

// ── State ─────────────────────────────────────────────────────────────────

let currentCat  = null;
let pool        = [];   // word pool for wrong answers
let queue       = [];   // current batch questions
let qIdx        = 0;
let batchPos    = 0;    // 0-4 within current batch
let hnPage      = 0;
let score = 0, total = 0;
let timerStart  = null;
let timerTick   = null;
const tipCache  = new Map();

// ── Helpers ───────────────────────────────────────────────────────────────

const esc   = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const clean = w => w.replace(/[^a-zA-ZæøåÆØÅ]/g,'');
const shuf  = a => [...a].sort(() => Math.random() - 0.5);

function stopOf(cat) { return CATS[cat]?.lang === 'da' ? STOP_DA : STOP_EN; }

function quizWords(title, cat) {
  const stop = stopOf(cat);
  return title.split(/\s+/).filter(w => {
    const c = clean(w).toLowerCase();
    return c.length >= 4 && !stop.has(c) && !/^\d/.test(c);
  });
}

function buildPool(headlines, cat) {
  const s = new Set();
  headlines.forEach(h => quizWords(h.title, cat).forEach(w => { const c = clean(w); if (c) s.add(c); }));
  return [...s];
}

function wrongAnswers(correct) {
  const cl = correct.toLowerCase();
  return shuf(pool.filter(w => w.toLowerCase() !== cl && Math.abs(w.length - correct.length) <= 4)).slice(0, 2);
}

function makeQ(h, cat) {
  const words = quizWords(h.title, cat);
  if (!words.length) return null;
  const sorted = [...words].sort((a, b) => clean(b).length - clean(a).length);
  const target = sorted[Math.floor(Math.random() * Math.min(3, sorted.length))];
  const wrong  = wrongAnswers(clean(target));
  if (wrong.length < 2) return null;
  const cl = clean(target).toLowerCase();
  let done = false;
  const html = h.title.split(' ').map(tok => {
    if (!done && clean(tok).toLowerCase() === cl) { done = true; return '<span class="blank"></span>'; }
    return esc(tok);
  }).join(' ');
  return { html, answer: clean(target), opts: shuf([clean(target), ...wrong]), url: h.url };
}

// ── Fetch ─────────────────────────────────────────────────────────────────

async function fetchHN(q, page) {
  const url = `https://hn.algolia.com/api/v1/search_by_date?query=${encodeURIComponent(q)}&tags=story&hitsPerPage=30&page=${page}`;
  const d = await fetch(url).then(r => r.json());
  return (d.hits || [])
    .filter(s => s.title && s.url && !['Ask HN','Show HN','Tell HN'].some(p => s.title.startsWith(p)))
    .map(s => ({ title: s.title, url: s.url }));
}

const DANISH_FEEDS = [
  'https://www.dr.dk/nyheder/service/feeds/allenyheder',
  'https://politiken.dk/rss/senestenyt.rss',
  'https://ekstrabladet.dk/rssfeed/nyheder/',
];

const DANISH_FALLBACK = [
  { title: 'Regeringen præsenterer ny klimaplan for Danmark', url: '#' },
  { title: 'Dansk økonomi vokser trods international usikkerhed', url: '#' },
  { title: 'Kongehuset fejrer jubilæum med stor folkefest i København', url: '#' },
  { title: 'Ny forskning fra Aarhus Universitet vækker international opsigt', url: '#' },
  { title: 'Rekordmange danskere rejser til udlandet i sommerferien', url: '#' },
  { title: 'Dansk fodboldlandshold sikrer sig VM-kvalifikation', url: '#' },
  { title: 'Politiet advarer mod ny svindelmetode rettet mod ældre danskere', url: '#' },
  { title: 'Stor brand i industriområde nord for Odense', url: '#' },
  { title: 'Sundhedsstyrelsen anbefaler ny vaccine til risikogrupper', url: '#' },
  { title: 'Dansk virksomhed sælges til udenlandsk kapitalfond', url: '#' },
  { title: 'Historisk tørke truer landbruget i store dele af Jylland', url: '#' },
  { title: 'Ny metrolinje i København åbner tidligere end ventet', url: '#' },
  { title: 'Børn og unge mistrives mere end nogensinde, viser undersøgelse', url: '#' },
  { title: 'Dansk forsker opdager ny metode til behandling af kræft', url: '#' },
  { title: 'Flygtningestrøm fra konfliktzone skaber pres på dansk asylsystem', url: '#' },
  { title: 'Elpriser falder markant efter ny aftale om vedvarende energi', url: '#' },
  { title: 'Aarhus kåret som en af Europas bedste byer at bo i', url: '#' },
  { title: 'Dronningen åbner ny udstilling på Nationalmuseet', url: '#' },
  { title: 'Kraftige storme rammer Vestjylland med stormflod til følge', url: '#' },
  { title: 'Dansk skuespiller nomineret til international filmpris', url: '#' },
];

async function fetchViaRss2json(feedUrl) {
  const url = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`;
  const d = await fetch(url, { signal: AbortSignal.timeout(7000) }).then(r => r.json());
  if (d.status !== 'ok' || !d.items?.length) return [];
  return d.items.map(item => {
    const desc = item.description?.replace(/<[^>]+>/g, '').trim() || '';
    if (item.link && desc) {
      try { tipCache.set(item.link, { pub: new URL(item.link).hostname.replace(/^www\./, ''), description: desc.substring(0, 220) }); } catch {}
    }
    return { title: item.title?.trim() || '', url: item.link || '#' };
  }).filter(h => h.title && h.url !== '#');
}

async function fetchDanish() {
  // Try all three sources in parallel, combine and deduplicate
  const results = await Promise.allSettled(DANISH_FEEDS.map(fetchViaRss2json));
  const seen = new Set();
  const combined = [];
  for (const r of results) {
    if (r.status === 'fulfilled') {
      for (const h of r.value) {
        if (!seen.has(h.title)) { seen.add(h.title); combined.push(h); }
      }
    }
  }
  return combined.length >= 5 ? combined : DANISH_FALLBACK;
}

// ── Load category ─────────────────────────────────────────────────────────

async function loadCat(catKey, isRefresh = false) {
  const cat = CATS[catKey];
  currentCat = catKey;
  if (!isRefresh) { hnPage = 0; score = 0; total = 0; updateScore(); }
  else             { hnPage++; }

  showState('load');
  document.getElementById('loadMsg').textContent =
    `Fetching ${cat.label} headlines…`;

  let headlines = [];
  try {
    if (cat.type === 'hn')   headlines = await fetchHN(cat.q, hnPage);
    else if (cat.type === 'da') headlines = await fetchDanish();
  } catch (e) { console.error(e); }

  if (!headlines.length) {
    showState('pick');
    document.getElementById('pickState').querySelector('h2').textContent = 'No headlines found';
    document.getElementById('pickState').querySelector('p').textContent  = 'Try a different category or refresh.';
    return;
  }

  pool = buildPool(headlines, catKey);
  const candidates = shuf(headlines.filter(h => quizWords(h.title, catKey).length >= 1));
  queue  = candidates.slice(0, BATCH).map(h => makeQ(h, catKey)).filter(Boolean);
  qIdx   = 0;
  batchPos = 0;

  if (!queue.length) {
    showState('pick');
    return;
  }

  showState('game');
  showQ();
}

// ── UI states ─────────────────────────────────────────────────────────────

function showState(s) {
  document.getElementById('pickState').style.display = s === 'pick' ? 'block' : 'none';
  document.getElementById('loadState').style.display = s === 'load' ? 'block' : 'none';
  document.getElementById('gameEl').style.display    = s === 'game' ? 'block' : 'none';
}

function updateScore() {
  document.getElementById('scoreEl').textContent = `${score} / ${total}`;
}

function renderProgress() {
  const el = document.getElementById('progressEl');
  el.innerHTML = Array.from({ length: BATCH }, (_, i) => {
    const cls = i < batchPos ? 'done' : i === batchPos ? 'current' : '';
    return `<span class="dot ${cls}"></span>`;
  }).join('');
}

// ── Timer ─────────────────────────────────────────────────────────────────

function startTimer() {
  clearInterval(timerTick);
  timerStart = Date.now();
  const el = document.getElementById('timerEl');
  el.className = 'timer running';
  timerTick = setInterval(() => {
    const s = (Date.now() - timerStart) / 1000;
    el.textContent = s < 10 ? `${s.toFixed(1)}s` : `${Math.floor(s)}s`;
  }, 100);
}

function stopTimer() {
  clearInterval(timerTick);
  timerTick = null;
  const s = (Date.now() - timerStart) / 1000;
  const el = document.getElementById('timerEl');
  el.className = 'timer done';
  el.textContent = s < 10 ? `${s.toFixed(1)}s` : `${Math.floor(s)}s`;
  return s;
}

// ── Show question ─────────────────────────────────────────────────────────

function showQ() {
  if (qIdx >= queue.length) { doRefresh(); return; }
  const q = queue[qIdx++];

  document.getElementById('headlineEl').innerHTML = q.html;
  document.getElementById('feedbackEl').className = 'feedback';
  document.getElementById('nextBtn').className    = 'next-btn';

  const opts = document.getElementById('optionsEl');
  opts.innerHTML = '';
  q.opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className   = 'opt';
    btn.textContent = opt;
    btn.addEventListener('click', () => answer(opt, q.answer, q.url));
    opts.appendChild(btn);
  });

  renderProgress();
  startTimer();
}

// ── Answer ────────────────────────────────────────────────────────────────

function answer(chosen, correct, url) {
  total++;
  const ok = chosen.toLowerCase() === correct.toLowerCase();
  if (ok) score++;
  updateScore();
  batchPos++;

  const secs = stopTimer();

  document.querySelectorAll('.opt').forEach(btn => {
    btn.disabled = true;
    if (btn.textContent.toLowerCase() === correct.toLowerCase()) btn.classList.add('correct');
    else if (btn.textContent === chosen) btn.classList.add('wrong');
  });

  const fb = document.getElementById('feedbackEl');
  fb.className = `feedback show ${ok ? 'ok' : 'bad'}`;

  if (ok) {
    const medal = secs < 3 ? '⚡ Lightning fast!' : secs < 8 ? '🎯 Sharp!' : secs < 20 ? '🤔 Took a moment…' : '🐢 Slow and steady!';
    if (url && url !== '#') {
      fb.innerHTML = `✅ <strong>"${esc(correct)}"</strong> — ${secs.toFixed(1)}s. ${medal}<br>
        <a id="aLink" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Read the article →</a>`;
      const a = document.getElementById('aLink');
      a.addEventListener('mouseenter', e => tipShow(e, url));
      a.addEventListener('mousemove',  e => tipMove(e));
      a.addEventListener('mouseleave', tipHide);
    } else {
      fb.textContent = `✅ "${correct}" — ${secs.toFixed(1)}s. ${medal}`;
    }
  } else {
    fb.textContent = `❌ The missing word was "${correct}".`;
  }

  renderProgress();
  document.getElementById('nextBtn').className = 'next-btn show';
}

// ── Next / Refresh ────────────────────────────────────────────────────────

function doNext() {
  tipHide();
  showQ();
}

async function doRefresh() {
  if (!currentCat) return;
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  btn.disabled = true;
  await loadCat(currentCat, true);
  btn.classList.remove('spinning');
  btn.disabled = false;
}

// ── Category click ────────────────────────────────────────────────────────

document.querySelector('.categories').addEventListener('click', e => {
  const btn = e.target.closest('.cat');
  if (!btn) return;
  document.querySelectorAll('.cat').forEach(b => b.classList.toggle('active', b === btn));
  document.getElementById('refreshBtn').classList.add('visible');
  tipHide();
  clearInterval(timerTick);
  loadCat(btn.dataset.cat, false);
});

// ── Tooltip ───────────────────────────────────────────────────────────────

const tipEl = document.getElementById('tooltip');
let   tipUrl = null;

function tipShow(e, url) {
  tipEl.classList.add('show');
  tipMove(e);
  tipUrl = url;

  tipEl.innerHTML = `
    <div class="tip-loading">
      <div class="tip-label">🔍 Fetching article…
        <span class="dots"><span></span><span></span><span></span></span>
      </div>
      <div class="shimmer-wrap">
        <div class="shimmer"></div>
        <div class="shimmer s"></div>
      </div>
    </div>`;

  if (tipCache.has(url)) { tipRender(tipCache.get(url)); return; }

  fetch(`https://api.microlink.io/?url=${encodeURIComponent(url)}`)
    .then(r => r.json())
    .then(d => {
      if (tipUrl !== url) return;
      const pub  = d.data?.publisher || (() => { try { return new URL(url).hostname.replace(/^www\./,''); } catch { return url; } })();
      const raw  = d.data?.description || d.data?.title || '';
      const desc = raw && !raw.match(/^[3-5]\d\d\b/) ? raw.slice(0, 220) : 'This site does not allow previews.';
      const res  = { pub, desc };
      tipCache.set(url, res);
      tipRender(res);
    })
    .catch(() => {
      const pub = (() => { try { return new URL(url).hostname.replace(/^www\./,''); } catch { return ''; } })();
      tipRender({ pub, desc: 'Could not load preview.' });
    });
}

function tipRender({ pub, desc }) {
  if (!tipEl.classList.contains('show')) return;
  tipEl.innerHTML = `<div class="tip-pub">${esc(pub)}</div><div class="tip-desc">${esc(desc)}</div>`;
}

function tipMove(e) {
  const pad = 14, tw = tipEl.offsetWidth || 270, th = tipEl.offsetHeight || 80;
  let left = e.clientX + pad;
  let top  = e.clientY - th - pad;
  if (left + tw > window.innerWidth  - pad) left = e.clientX - tw - pad;
  if (top        < pad)                     top  = e.clientY + pad;
  tipEl.style.left = left + 'px';
  tipEl.style.top  = top  + 'px';
}

function tipHide() { tipEl.classList.remove('show'); tipUrl = null; }
</script>
